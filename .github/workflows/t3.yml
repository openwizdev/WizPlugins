name: T3

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: t3-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: wizbar/package-lock.json
      - name: Install WizBar's locked TypeScript
        working-directory: wizbar
        run: npm ci
      - name: Typecheck
        working-directory: t3
        run: npm run typecheck
      - name: Test
        working-directory: t3
        run: npm test
        env:
          # The rail's browser test runs in the runner's Chrome; on CI a missing browser fails, never skips.
          T3_REQUIRE_BROWSER: "1"
